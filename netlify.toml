# ----------------------------------------------------------------------
# Netlify config for overhauled.ai
# ----------------------------------------------------------------------

[build]
publish = "."

# Pretty URLs for the new pages — keep .html on disk, serve at clean path


# .html versions: 301-redirect to clean URL (force=true overrides static serving)


# Force /contact to serve the new contact/index.html (overrides legacy contact.html)
[[redirects]]
from = "/contact"
to = "/contact/index.html"
status = 200
force = true

[[redirects]]
from = "/contact.html"
to = "/contact"
status = 301
force = true

# Pretty URL for /about
[[redirects]]
from = "/about"
to = "/about/index.html"
status = 200

[[redirects]]
from = "/about.html"
to = "/about"
status = 301
force = true

# Redirect stale /assessment page → /tune-up/ (renamed package)


# Redirect old /ai-agents page → /work/ (our case studies)


# Redirect the raw Netlify subdomain to the primary domain
[[redirects]]
from = "https://stellar-pavlova-6e1103.netlify.app/*"
to = "https://overhauled.ai/:splat"
status = 301
force = true

[[redirects]]
from = "/assessment"
to = "/#contact"
status = 301
force = true

[[redirects]]
from = "/assessment/*"
to = "/#contact"
status = 301
force = true
